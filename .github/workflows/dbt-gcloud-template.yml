name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'dbt/**'
  pull_request:
    branches:
      - main
    paths:
      - 'dbt/**'
  workflow_dispatch:

env:
  REGION:     us-east4
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REPOSITORY: sw-dataflow-template
  IMAGE_NAME: dbt-docker-image

jobs:

  build-and-push:
    name: "Build & Push Docker Image"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id:                 ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account:            ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Setup GCloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: 'latest'

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.run_id }}"
          LATEST="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Docker Build & Push"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Image  : $IMAGE"
          echo "  Source : ./dbt/Dockerfile"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          echo "Building Docker image..."
          docker build \
            --no-cache \
            --tag "$IMAGE" \
            --tag "$LATEST" \
            --file "./dbt/Dockerfile" \
            ./dbt

          echo "Pushing image with run_id tag..."
          docker push "$IMAGE"

          echo "Pushing image with latest tag..."
          docker push "$LATEST"

          echo "✅ Image successfully pushed:"
          echo "   → $IMAGE"
          echo "   → $LATEST"