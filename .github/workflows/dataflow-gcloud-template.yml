name: Dataflow Template Build

on:
  pull_request:
    branches:
      - main
    paths:
      - 'dataflowscript/**'
  workflow_dispatch:

env:
  TF_DIR: ./dataflowscript

jobs:
  build-dataflow-template:
    name: Build Dataflow Flex Template
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Setup GCloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: 'latest'

      - name: Build Dataflow Flex Template
        run: |
          echo "Building Dataflow Flex Template and uploading to GCS...${{ github.run_id }}"
          gcloud dataflow flex-template build \
            gs://sw-rds-dataflow-gcs-itp/templates/oden-gcs-parquet-${{ github.run_id }}.json \
            --image-gcr-path="us-east4-docker.pkg.dev/sw-dev-prj-sandbox/sw-dataflow-template/oden-gcs-parquet:${{ github.run_id }}" \
            --sdk-language=PYTHON \
            --flex-template-base-image=PYTHON3 \
            --py-path="." \
            --env=FLEX_TEMPLATE_PYTHON_PY_FILE=./dataflowscript/oden_pubsub_to_gcs.py \
            --env=FLEX_TEMPLATE_PYTHON_REQUIREMENTS_FILE=./dataflowscript/requirements.txt \
            --metadata-file=./dataflowscript/metadata.json \
            --project=sw-dev-prj-sandbox \
            --verbosity=debug

      - name: Confirm Template Upload
        run: |
          echo "Verifying template was uploaded to GCS..."
          gsutil ls gs://sw-rds-dataflow-gcs-itp/templates/oden-gcs-parquet-${{ github.run_id }}.json

  # ──────────────────────────────────────────
  # Step 2: Plan — show what will be deployed
  # ──────────────────────────────────────────
  plan-dataflow-template:
    name: Plan Dataflow Deployment
    needs: build-dataflow-template
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Setup GCloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: 'latest'

      - name: Show Deployment Plan
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Deploying Dataflow Flex Template"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Job Name          : sw-oden-pubsub-to-gcs"
          echo "  Template          : gs://sw-rds-dataflow-gcs-itp/templates/oden-gcs-parquet-${{ github.run_id }}.json"
          echo "  Region            : us-east4"
          echo "  Project           : sw-dev-prj-sandbox"
          echo "  Service Acct      : dataflow-runner@sw-dev-prj-sandbox.iam.gserviceaccount.com"
          echo "  Network           : dataflow-network"
          echo "  Subnetwork        : regions/us-east4/subnetworks/dataflow-subnet"
          echo "  Public IPs        : Disabled"
          echo "  Streaming Engine  : Enabled"
          echo "  Input Subscription: projects/sw-dev-prj-sandbox/subscriptions/proficy-historian-topic"
          echo "  BQ OK Table       : sw-dev-prj-sandbox:pubsub_gcs_dataset.historian_stream"
          echo "  BQ Error Table    : sw-dev-prj-sandbox:pubsub_gcs_dataset.historian_stream_error"
          echo "  GCS Output Path   : gs://sw-rds-dataflow-gcs-itp/output/"
          echo "  Temp Location     : gs://sw-rds-dataflow-gcs-itp/tmp"
          echo "  Staging Location  : gs://sw-rds-dataflow-gcs-itp/staging"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Validate Template Exists in GCS
        run: |
          echo "Validating template is available in GCS before deploy..."
          gsutil stat gs://sw-rds-dataflow-gcs-itp/templates/oden-gcs-parquet-${{ github.run_id }}.json
          echo "✅ Template found — ready for deployment"

      - name: Preview Active Dataflow Jobs
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Currently Running Dataflow Jobs"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          gcloud dataflow jobs list \
            --region="us-east4" \
            --project=sw-dev-prj-sandbox \
            --filter="currentState=JOB_STATE_RUNNING" \
            --format="table(id, name, currentState, startTime)"

  # ──────────────────────────────────────────
  # Step 3: Approval gate after plan review
  # ──────────────────────────────────────────
  approval:
    name: Approval Gate
    needs: plan-dataflow-template       # ← waits for plan, not build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    environment:
      name: dataflow-approval
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Approval Required
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Review the plan above, then approve"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo " Approval granted - proceeding to deploy"

  # ──────────────────────────────────────────
  # Step 4: Deploy after approval
  # ──────────────────────────────────────────
  deploy-dataflow-template:
    name: Deploy Dataflow Flex Template
    needs: approval
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Setup GCloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: 'latest'

      - name: Drain Dataflow Job
        run: |
          JOB_ID=$(gcloud dataflow jobs list \
            --project=sw-dev-prj-sandbox \
            --region=us-east4 \
            --filter="name=sw-oden-pubsub-to-gcs AND state=Running" \
            --format=value\(id\) \
            | head -n 1)

          if [ -z "$JOB_ID" ]; then
            echo "No running job found with name sw-oden-pubsub-to-gcs. Skipping drain."
            exit 0
          fi

          echo "Found running job: $JOB_ID - initiating drain..."
          gcloud dataflow jobs drain "$JOB_ID" \
            --project=sw-dev-prj-sandbox \
            --region=us-east4

          echo "Waiting for job to finish draining..."
          while true; do
            STATE=$(gcloud dataflow jobs describe "$JOB_ID" \
              --project=sw-dev-prj-sandbox \
              --region=us-east4 \
              --format=value\(currentState\))
            echo "Current state: $STATE"
            if [ "$STATE" = "JOB_STATE_DRAINED" ] || [ "$STATE" = "JOB_STATE_DONE" ] || [ "$STATE" = "JOB_STATE_CANCELLED" ]; then
              echo "Job drained successfully."
              break
            fi
            sleep 30
          done

      - name: Deploy Dataflow Flex Template
        run: |
          echo "Deploying Dataflow Flex Template from GCS...${{ github.run_id }}"
          gcloud dataflow flex-template run "sw-oden-pubsub-to-gcs" \
            --project="sw-dev-prj-sandbox" \
            --region="us-east4" \
            --template-file-gcs-location="gs://sw-rds-dataflow-gcs-itp/templates/oden-gcs-parquet-${{ github.run_id }}.json" \
            --service-account-email="dataflow-runner@sw-dev-prj-sandbox.iam.gserviceaccount.com" \
            --network="dataflow-network" \
            --subnetwork="regions/us-east4/subnetworks/dataflow-subnet" \
            --disable-public-ips \
            --enable-streaming-engine \
            --parameters=subscription="projects/sw-dev-prj-sandbox/subscriptions/proficy-historian-topic" \
            --parameters=bq_table_ok="sw-dev-prj-sandbox:pubsub_gcs_dataset.historian_stream" \
            --parameters=bq_table_err="sw-dev-prj-sandbox:pubsub_gcs_dataset.historian_stream_error" \
            --parameters=gcs_output_path="gs://sw-rds-dataflow-gcs-itp/output/" \
            --parameters=temp_location="gs://sw-rds-dataflow-gcs-itp/tmp" \
            --parameters=staging_location="gs://sw-rds-dataflow-gcs-itp/staging"

      - name: Confirm Dataflow Job Launched
        run: |
          echo "Verifying Dataflow job was launched..."
          gcloud dataflow jobs list \
            --region="us-east4" \
            --project=sw-dev-prj-sandbox \
            --filter="name:oden-gcs-parquet-${{ github.run_id }}" \
            --format="table(id, name, currentState, startTime)"