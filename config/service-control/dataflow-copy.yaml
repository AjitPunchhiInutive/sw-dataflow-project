bigquery:
  # ── Source (where procedure lives + tables are copied FROM) ─────────────────
  source:
    project:   "sw-dev-prj-sandbox"
    dataset:   "pubsub_gcs_dataflow"
    routine:   "sp_clone_all_tables_demo"
    location:  "us-east4"

  # ── Destination (where tables are cloned TO) ─────────────────────────────────
  destination:
    project:        "sw-dev-prj-itp-secrets"
    dataset:        "copyjob_streaming_dataset_demo"
    friendly_name:  "SW copyjob Streaming Dataset"
    description:    "SW copyjob Streaming Dataset - Main streaming tables"
    location:       "us-east4"

  # ── Job Config ────────────────────────────────────────────────────────────────
  job:
    job_id:         "invoke-sp-clone-all-tables-v4"
    use_legacy_sql: false

  # ── Scheduled Query Config ────────────────────────────────────────────────────
  schedule:
    display_name:         "Nightly-Dev-Reset-demo"
    schedule:             "every 24 hours"
    service_account:      "dataflow-runner@sw-dev-prj-sandbox.iam.gserviceaccount.com"

  # ── Dataset Options ───────────────────────────────────────────────────────────
  options:
    default_table_expiration_ms:     null
    default_partition_expiration_ms: null
    delete_contents_on_destroy:      false