# config/dataplex/manufacturing.yaml
name: manufacturing
prefix: dev
project_id: sw-dev-prj-sandbox
region: us-east4

zones:

  rds:
    type: RAW
    discovery: true
    assets:
      ot_telemetry:
        resource_name:          snoflake_iceberg
        cron_schedule:          null
        discovery_spec_enabled: true
        resource_spec_type:     BIGQUERY_DATASET
      plant_reference:
        resource_name:          raw_dev_eds
        cron_schedule:          null
        discovery_spec_enabled: true
        resource_spec_type:     BIGQUERY_DATASET
      plant_operations:
        resource_name:          pubsub_gcs_dataflow
        cron_schedule:          null
        discovery_spec_enabled: true
        resource_spec_type:     BIGQUERY_DATASET

  eds:
    type: CURATED
    discovery: true
    assets:
      eds1:
        resource_name:          pubsub_gcs_dataflow
        cron_schedule:          null
        discovery_spec_enabled: false
        resource_spec_type:     BIGQUERY_DATASET

  ods:
    type: CURATED
    discovery: true
    assets:
      ods1:
        resource_name:          pubsub_gcs_dataflow
        cron_schedule:          null
        discovery_spec_enabled: false
        resource_spec_type:     BIGQUERY_DATASET