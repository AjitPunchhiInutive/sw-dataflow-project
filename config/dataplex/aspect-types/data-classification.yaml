display_name: "Data Classification"
description:  "The Data Classification aspect categorizes data to guide appropriate protection, access, and data sharing practices."

labels:
  env:           dev
  domain:        na
  location:      us-east4
  managed-by:    terraform

metadata_template: |
  {
    "name": "data-classification",
    "type": "record",
    "recordFields": [
      {
        "name": "sensitivity-level",
        "type": "enum",
        "index": 1,
        "annotations": {
          "displayName": "Sensitivity Level",
          "description": "The Data Sensitivity aspect classifies data sensitivity to inform column protection and sharing."
        },
        "constraints": { "required": true },
        "enumValues": [
          { "name": "L1-Public",       "index": 1 },
          { "name": "L2-Internal",     "index": 2 },
          { "name": "L3-Confidential", "index": 3 },
          { "name": "L4-Restricted",   "index": 4 }
        ]
      },
      {
        "name": "data-category",
        "type": "enum",
        "index": 2,
        "annotations": {
          "displayName": "Data Category",
          "description": "The Data Category aspect identifies the type of data within the data sensitivity framework to help organize, understand, and manage it consistently across the organization."
        },
        "constraints": { "required": true },
        "enumValues": [
          { "name": "Personal_Identifiable_Information_PII", "index": 1 },
          { "name": "Operational_and_Production_Data",       "index": 2 },
          { "name": "Quality_and_Inspection_Data",           "index": 3 },
          { "name": "Safety_and_Inspection_Data",            "index": 4 },
          { "name": "General_and_Internal_Use",              "index": 5 }
        ]
      }
    ]
  }