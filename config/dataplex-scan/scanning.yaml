# Identity
project_id:          sw-dev-prj-sandbox 
log_project_id:      sw-dev-prj-sandbox
scan_name:           customer-orders-profile
location:            us-central1

# Source table
bq_source_project:   sw-dev-prj-sandbox
bq_source_dataset:   pubsub_gcs_dataflow
bq_source_table:     historian_stream

# Execution
execution_schedule:         "TZ=UTC 0 2 * * *"
execution_service_account:  "github-actions@melodic-furnace-403022.iam.gserviceaccount.com"

# Profile spec
sampling_percent:  20
row_filter:        "order_date >= '2024-01-01' AND status != 'CANCELLED'"
include_fields:    [order_id, customer_id, order_date, amount, status, region]
exclude_fields:    [customer_email, phone_number, credit_card_last4]

# Results export
results_dataset_id:  dataplex_profile_results
results_table_id:    customer_orders_profile

# Labels
labels:
  managed_by:   terraform
  environment:  dev
  team:         data-platform